name: Wheel build

on:
  workflow_dispatch:

# The per-job `contents: write` blocks are gone with the Release steps; checkout still
# needs read, which the jobs previously inherited from those write grants.
permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    # "3.x" now resolves to 3.13/3.14, which the release-era setuptools 69.0.2 and
    # Sphinx 7.2.x predate. 3.12 is what "3.x" resolved to on 2023-12-19.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # libxml2 2.9.13* is only in the Ubuntu 22.04 archive; ubuntu-latest ships 2.9.14+,
    # so the exact-version pin is unsatisfiable. STATIC_DEPS=false here is used only to
    # import lxml while rendering the docs, so the system libxml2 does not enter the sdist.
    - name: Install lib dependencies
      run: sudo apt-get update -y -q && sudo apt-get install -y -q libxml2 libxml2-dev libxslt1.1 libxslt1-dev

    - name: Install Python dependencies
      run: python -m pip install -U pip "setuptools==69.0.2" --index-url 'https://:2023-12-22@time-machines-pypi.sealsecurity.io/' && python -m pip install -U docutils pygments sphinx sphinx-rtd-theme -r requirements.txt --index-url 'https://:2023-12-22@time-machines-pypi.sealsecurity.io/'

    - name: Build docs and sdist
      run: make html sdist
      env: { STATIC_DEPS: false }

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error

    # The rendered website is not a released artifact — upstream uploads it only to publish
    # lxml.de. `make html` still runs above (the sdist embeds doc/html), but uploading the
    # tree floods the artifact set with hundreds of same-named index.html files, which makes
    # the release artifact set ambiguous.

  Linux:
    runs-on: ubuntu-latest
    # The *_aarch64 legs build under QEMU emulation (~10x slower than native), and the
    # ali-security fork has no arm64 Linux runner to move them to, so a whole
    # build+test cycle for one image does not fit in 45 minutes. Capped at 47 anyway so a
    # wedged emulated leg fails itself inside the run's own polling budget.
    timeout-minutes: 47

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        image:
          - manylinux1_x86_64
          - manylinux1_i686
          - manylinux_2_24_i686
          - manylinux_2_24_x86_64
          - manylinux_2_28_x86_64
          - musllinux_1_1_x86_64
          #- manylinux_2_24_ppc64le
          #- manylinux_2_24_ppc64le
          #- manylinux_2_24_s390x
        pyversion: ["*"]

        exclude:
          - image: manylinux_2_24_aarch64
            pyversion: "*"
          - image: musllinux_1_1_aarch64
            pyversion: "*"
        include:
          # aarch64 images build on the x64 runner under QEMU emulation, registered by
          # the Makefile's `qemu-user-static` prerequisite. The ali-security fork has no
          # arm64 Linux runner (`ubuntu-24.04-arm` / `ubuntu-22.04-arm` are not enabled
          # there — a job requesting one never gets picked up), so QEMU is the only path.
          - image: manylinux2014_aarch64
            pyversion: "cp36*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp37*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp38*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp39*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp310*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp311*"
          - image: manylinux_2_28_aarch64
            pyversion: "cp311*"
          # NOTE: the archived manylinux_2_24 images ship cp36-cp311 only (no cp312),
          # which is why the public 4.9.4 release has no cp312 manylinux_2_24 wheel.
          # The upstream "manylinux_2_24_aarch64 / cp312*" leg can only fail, so it is
          # dropped rather than masked.
          - image: manylinux_2_28_aarch64
            pyversion: "cp312*"

          - image: musllinux_1_1_aarch64
            pyversion: "cp36*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp37*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp38*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp39*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp310*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp311*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp312*"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # libxml2 2.9.13* is only in the Ubuntu 22.04 archive; the runners used here ship
    # 2.9.14+, so the exact-version pin is unsatisfiable. This step only serves
    # `make sdist` with STATIC_DEPS=false (cythonize + pack sources); the wheels are
    # built against statically compiled libxml2 2.10.3 inside the manylinux containers,
    # so the system libxml2 version does not affect any artifact bytes.
    - name: Install lib dependencies
      run: sudo apt-get update -y -q && sudo apt-get install -y -q libxml2 libxml2-dev libxslt1.1 libxslt1-dev

    - name: Install dependencies
      run: python -m pip install "setuptools==69.0.2" -r requirements.txt --index-url 'https://:2023-12-22@time-machines-pypi.sealsecurity.io/'

    - name: Build sdist
      run: make sdist
      env: { STATIC_DEPS: false }

    - name: Build Linux wheels
      run: make wheel_${{ matrix.image }}
      env: { STATIC_DEPS: true, PYTHON_BUILD_VERSION: "${{ matrix.pyversion }}" }

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.image }}-${{ strategy.job-index }}
        path: wheelhouse/*/*-m*linux*.whl  # manylinux / musllinux
        if-no-files-found: error

  non-Linux:
    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        # macos-13 is rejected as a retired label by the fork's runner check, so macOS
        # runs on macos-latest (arm64). Wheels are built universal2 (ARCHFLAGS below) so
        # the arm64 host can still execute the test suite that `RUN_TESTS=true` runs.
        # windows-2019 is retired -> windows-2022.
        os: [macos-latest, windows-2022]
        #os: [macos-10.15, windows-latest]
        #os: [macos-10.15]
        python-version:
          - "2.7"
          - "3.6"
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "pypy-3.8-v7.3.7"
          - "pypy-3.9-v7.3.12"
          - "pypy-3.10-v7.3.13"
        # Interpreter bitness, passed to actions/setup-python. x64 is the default for
        # every leg above (macos-13 is Intel, windows-2022 is x64); the win32 legs are
        # added as `include:` entries below.
        architecture: [x64]

        #include:
        #  - os: windows-2016
        #    python-version: 2.7
        exclude:
          - os: windows-2022
            python-version: 2.7  # needs older image
          # macos-latest is arm64 and CPython published no darwin-arm64 build before
          # 3.9, so setup-python cannot provision 2.7/3.6/3.7/3.8 there at all (and
          # pypy 7.3.7 has no macos_arm64 asset). These runtimes stay on Windows,
          # where they run fine.
          - os: macos-latest
            python-version: 2.7
          - os: macos-latest
            python-version: "3.6"
          - os: macos-latest
            python-version: "3.7"
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "pypy-3.8-v7.3.7"

        # 32-bit Windows wheels. The public 4.9.4 release ships
        # lxml-4.9.4-cp3{6,7,8,9,10,11,12}-*-win32.whl, which upstream's wheels.yml never
        # built — they came from AppVeyor (appveyor.yml). A win32 leg is runnable here
        # because an x64 Windows runner executes 32-bit binaries via WoW64, and
        # actions/python-versions publishes win32-x86 builds for every one of these
        # (3.6.8 / 3.7.9 / 3.8.10 / 3.9.13 / 3.10.11 / 3.11.x / 3.12.x).
        # `architecture: x86` overwrites the axis default, so each entry below cannot be
        # merged into an existing combination and adds a new one instead.
        # No cp27 win32/win_amd64 leg: no runner image carries a CPython 2.7 + MSVC 9.0
        # toolchain, so those two published wheels are not producible on GHA at all.
        include:
          - os: windows-2022
            python-version: "3.6"
            architecture: x86
          - os: windows-2022
            python-version: "3.7"
            architecture: x86
          - os: windows-2022
            python-version: "3.8"
            architecture: x86
          - os: windows-2022
            python-version: "3.9"
            architecture: x86
          - os: windows-2022
            python-version: "3.10"
            architecture: x86
          - os: windows-2022
            python-version: "3.11"
            architecture: x86
          - os: windows-2022
            python-version: "3.12"
            architecture: x86

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env: { LIBXML2_VERSION: 2.10.3, LIBXSLT_VERSION: 1.1.39, MACOSX_DEPLOYMENT_TARGET: 11.0 }

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      if: startsWith(matrix.python-version, '3.') || startsWith(matrix.python-version, 'pypy')
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Install MacOS dependencies
      if: startsWith(runner.os, 'mac')
      run: |
        brew install automake libtool
        # Homebrew's prefix is /opt/homebrew on the arm64 runners, /usr/local on Intel.
        ln -s "$(brew --prefix)/bin/glibtoolize" "$(brew --prefix)/bin/libtoolize"

    # Pin the release-era build backend. The public 4.9.4 wheels report the newest
    # 2023-12-19-era `wheel` that each interpreter supports:
    #   cp36 -> `Generator: bdist_wheel (0.37.1)`,  cp37+/pypy -> `(0.42.0)`;
    # all report `Metadata-Version: 2.1`. So this must be an upper-bounded RANGE, not an
    # exact pin (setuptools 69.x / wheel 0.42 do not install on py3.6 at all). The bound
    # is also what forces a replacement: setup-python pre-installs setuptools/wheel, so an
    # unpinned `pip install setuptools wheel` is a no-op and leaves the image's versions.
    - name: Install dependencies
      run: python -m pip install "setuptools<70" "wheel<0.43" -r requirements.txt --index-url 'https://:2023-12-22@time-machines-pypi.sealsecurity.io/'

    # The published cp311/cp312 macOS wheels are macosx_11_0_universal2. The fork's only
    # macOS runner is arm64, so build both slices explicitly: universal2 keeps a native
    # arm64 slice, which is what lets `RUN_TESTS=true` still execute the suite on the
    # host. Linux/Windows legs are unaffected (ARCHFLAGS is macOS-only).
    - name: Build wheels
      run: make wheel
      env:
        STATIC_DEPS: true
        RUN_TESTS: true
        ARCHFLAGS: ${{ startsWith(matrix.os, 'macos') && '-arch x86_64 -arch arm64' || '' }}

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: dist/lxml-*.whl
        if-no-files-found: error
